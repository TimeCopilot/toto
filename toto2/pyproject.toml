[project]
name = "timecopilot-toto-2"
version = "0.1.1"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "einops>=0.7.0",
    "numpy>=1.26.0",
    "gluonts[torch]>=0.16.0",
    "huggingface-hub>=0.20.0",
    "safetensors>=0.4.0",
    "jaxtyping>=0.2.25",
    "timecopilot-dd-unit-scaling>=0.1.0",
    "matplotlib>=3.9.0",
    "typing-extensions>=4.0.0; python_version < '3.11'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["toto2*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["F722"]

[tool.ruff.lint.isort]
combine-as-imports = true
